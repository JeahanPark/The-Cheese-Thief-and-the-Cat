<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; background: #0a0f16;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    a { color: #ffd84d; } a:hover { color: #ffe9a3; }
  </style>
</helmet>

<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; color: #e9edf2;
            background: radial-gradient(70% 60% at 50% 44%, #1c2536 0%, #0d131c 55%, #070a0f 100%);">

  <div style="position: absolute; left: 0; right: 0; top: 300px; height: 420px; opacity: 0.35;
              background: linear-gradient(180deg, #2a2113 0%, #120e0b 100%);"></div>
  <div style="position: absolute; inset: 0; box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.85);"></div>

  <!-- 스포트라이트 -->
  <div style="position: absolute; left: 640px; top: 0; width: 420px; height: 560px; transform: translateX(-50%);
              background: linear-gradient(180deg, rgba(255,216,77,0.2) 0%, rgba(255,216,77,0.05) 55%, rgba(255,216,77,0) 100%);
              clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 66px; display: flex; flex-direction: column;
              align-items: center; gap: 12px;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.32em; color: #8b97a5;">이번 판의 고양이는</div>
    <div style="font-size: 52px; font-weight: 900; letter-spacing: -0.02em; color: {{titleColor}};
                text-shadow: 0 6px 26px rgba(0,0,0,0.8);">{{title}}</div>
  </div>

  <!-- 참가자 카드 줄 -->
  <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 236px;
              display: flex; align-items: flex-end; gap: 18px;">

    <div style="width: 168px; height: 216px; border-radius: 13px; background: rgba(14,19,28,0.72);
                border: 1px solid #202b3c; opacity: 0.4; display: flex; flex-direction: column;
                align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 16px;">
      <svg width="70" height="74" viewBox="0 0 60 64" fill="none" aria-hidden="true">
        <ellipse cx="30" cy="60" rx="19" ry="4" fill="#000" opacity="0.4"/>
        <ellipse cx="28" cy="42" rx="16" ry="13" fill="#4b5766"/>
        <circle cx="19.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="36.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="28" cy="29.4" r="12.4" fill="#4b5766"/>
      </svg>
      <div style="font-size: 14px; font-weight: 700; color: #8b97a5;">야옹이대장</div>
    </div>

    <div style="width: 168px; height: 216px; border-radius: 13px; background: rgba(14,19,28,0.72);
                border: 1px solid #202b3c; opacity: 0.4; display: flex; flex-direction: column;
                align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 16px;">
      <svg width="70" height="74" viewBox="0 0 60 64" fill="none" aria-hidden="true">
        <ellipse cx="30" cy="60" rx="19" ry="4" fill="#000" opacity="0.4"/>
        <ellipse cx="28" cy="42" rx="16" ry="13" fill="#4b5766"/>
        <circle cx="19.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="36.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="28" cy="29.4" r="12.4" fill="#4b5766"/>
      </svg>
      <div style="font-size: 14px; font-weight: 700; color: #8b97a5;">생쥐삼형제</div>
    </div>

    <!-- 당첨 카드 -->
    <div style="width: 208px; height: 272px; border-radius: 15px; position: relative;
                background: linear-gradient(180deg, rgba(255,216,77,0.16), rgba(20,27,39,0.9));
                border: 2px solid #ffd84d; box-shadow: 0 0 60px rgba(255,216,77,0.32);
                display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
                gap: 14px; padding-bottom: 18px;">
      <div style="position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
                  background: #ffd84d; color: #221a04; font-size: 12px; font-weight: 900;
                  border-radius: 999px; padding: 5px 16px; letter-spacing: 0.06em;">고양이</div>
      <svg width="128" height="112" viewBox="0 0 172 132" fill="none" aria-hidden="true">
        <ellipse cx="86" cy="124" rx="54" ry="7" fill="#000" opacity="0.5"/>
        <path d="M34 120 C26 90 40 60 70 54 C74 40 84 34 92 40 C100 34 110 40 114 54 C144 60 158 90 150 120 Z" fill="#14100c"/>
        <ellipse cx="72" cy="80" rx="9" ry="12" fill="#ffd84d"/>
        <ellipse cx="112" cy="80" rx="9" ry="12" fill="#ffd84d"/>
        <ellipse cx="72" cy="80" rx="2.6" ry="10" fill="#0a0f16"/>
        <ellipse cx="112" cy="80" rx="2.6" ry="10" fill="#0a0f16"/>
      </svg>
      <div style="font-size: 19px; font-weight: 900; color: #ffe9a3;">{{winnerName}}</div>
    </div>

    <div style="width: 168px; height: 216px; border-radius: 13px; background: rgba(14,19,28,0.72);
                border: 1px solid #202b3c; opacity: 0.4; display: flex; flex-direction: column;
                align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 16px;">
      <svg width="70" height="74" viewBox="0 0 60 64" fill="none" aria-hidden="true">
        <ellipse cx="30" cy="60" rx="19" ry="4" fill="#000" opacity="0.4"/>
        <ellipse cx="28" cy="42" rx="16" ry="13" fill="#4b5766"/>
        <circle cx="19.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="36.5" cy="23.5" r="7.1" fill="#3b4552"/>
        <circle cx="28" cy="29.4" r="12.4" fill="#4b5766"/>
      </svg>
      <div style="font-size: 14px; font-weight: 700; color: #8b97a5;">숨은쥐</div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 548px;
              font-size: 15px; color: #cfd6de;">{{subline}}</div>

  <!-- 연출 순서 -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 20px;
              display: flex; align-items: stretch; gap: 10px;">
    <sc-for list="{{beats}}" as="b" hint-placeholder-count="4">
      <div style="flex-grow: 1; background: rgba(14,19,28,0.78); border: 1px solid #202b3c;
                  border-radius: 9px; padding: 11px 14px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #ffd84d;
                    font-variant-numeric: tabular-nums;">{{b.time}}</div>
        <div style="font-size: 13px; font-weight: 700;">{{b.title}}</div>
        <div style="font-size: 12px; color: #8b97a5; line-height: 1.45;">{{b.desc}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"viewer":{"editor":"enum","options":["남의 화면","내가 고양이"],"default":"남의 화면","section":"보는 사람"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const mine = (this.props.viewer ?? '남의 화면') === '내가 고양이';
    return {
      title: mine ? '바로 당신' : '야옹이대장',
      titleColor: mine ? '#f2705c' : '#ffe9a3',
      winnerName: mine ? '치즈사냥꾼 (나)' : '야옹이대장',
      subline: mine ? '쥐들이 창고를 털기 전에 잡아라.' : '나머지는 전부 쥐다. 들키지 말고 벌어라.',
      beats: [
        { time: '0.0s', title: '암전', desc: '대기실이 어두워지고 참가자만 남는다' },
        { time: '0.4s', title: '스포트라이트 회전', desc: '조명이 참가자 사이를 빠르게 돈다' },
        { time: '1.8s', title: '감속 · 정지', desc: '한 명 위에서 멈추고 카드가 커진다' },
        { time: '2.6s', title: '변신 · 공개', desc: '쥐가 고양이 실루엣으로 바뀐다' },
        { time: '4.2s', title: '페이드 → 인게임', desc: '맵 로딩으로 넘어간다' }
      ]
    };
  }
}
</script>
</body>
</html>
