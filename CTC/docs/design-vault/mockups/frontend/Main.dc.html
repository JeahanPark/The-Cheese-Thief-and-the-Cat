<script data-dc-script data-props='{"phase":{"editor":"enum","options":["확인 중","완료","실패"],"default":"확인 중","section":"상태"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const phase = this.props.phase ?? '확인 중';
    const failed = phase === '실패';
    const ready = phase === '완료';

    const mk = (label, kind) => ({
      label: label,
      isDone: kind === 'done',
      isBusy: kind === 'busy',
      isFail: kind === 'fail',
      color: kind === 'done' ? '#cfd6de' : kind === 'fail' ? '#ff9b8a' : '#8b97a5',
      border: kind === 'fail' ? '#6b3630' : kind === 'done' ? '#26313f' : '#1a2230'
    });

    let rows;
    if (failed) {
      rows = [mk('게임 데이터', 'done'), mk('개인 설정', 'done'), mk('스팀 연결', 'fail'), mk('스팀 릴레이', 'busy')];
    } else if (ready) {
      rows = [mk('게임 데이터', 'done'), mk('개인 설정', 'done'), mk('스팀 연결', 'done'), mk('스팀 릴레이', 'done')];
    } else {
      rows = [mk('게임 데이터', 'done'), mk('개인 설정', 'done'), mk('스팀 연결', 'done'), mk('스팀 릴레이', 'busy')];
    }

    const done = rows.filter((r) => r.isDone).length;

    return {
      rows: rows,
      isFailed: failed,
      isReady: ready,
      progress: Math.round((done / rows.length) * 100) + '%',
      steamLabel: failed ? '스팀 연결 안 됨' : '스팀 연결됨',
      steamColor: failed ? '#f2705c' : '#80d16b'
    };
  }
}
</script>
