<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" font-family="Malgun Gothic, sans-serif">
  <defs>
    <pattern id="tunnel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8d6e4a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6d4f30" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- 바닥 -->
  <rect x="40" y="40" width="600" height="600" fill="#e8e2d6"/>

  <!-- 쥐 터널 링 (외곽, 벽·가구 밑 — 쥐만 통과) -->
  <rect x="46" y="46" width="588" height="26" fill="url(#tunnel)" opacity="0.85"/>
  <rect x="46" y="608" width="588" height="26" fill="url(#tunnel)" opacity="0.85"/>
  <rect x="46" y="46" width="26" height="588" fill="url(#tunnel)" opacity="0.85"/>
  <rect x="608" y="46" width="26" height="588" fill="url(#tunnel)" opacity="0.85"/>

  <!-- 가구 (터널 위를 덮는 구조물) -->
  <g fill="#5a5a66" stroke="#3d3d47" stroke-width="2">
    <rect x="100" y="50" width="280" height="50"/>   <!-- 북 카운터 -->
    <rect x="50" y="90" width="46" height="270"/>    <!-- 서 카운터 -->
    <rect x="590" y="240" width="44" height="240"/>  <!-- 동 카운터 -->
  </g>
  <rect x="580" y="80" width="52" height="52" fill="#f5f5f0" stroke="#3d3d47" stroke-width="2"/> <!-- 냉장고 -->
  <text x="606" y="112" font-size="11" text-anchor="middle">냉장고</text>
  <rect x="50" y="580" width="52" height="52" fill="#f5f5f0" stroke="#3d3d47" stroke-width="2"/> <!-- 찬장 -->
  <text x="76" y="610" font-size="11" text-anchor="middle">찬장</text>
  <rect x="280" y="360" width="120" height="66" fill="#4a4a54" stroke="#3d3d47" stroke-width="2"/> <!-- 아일랜드 -->
  <text x="340" y="397" font-size="12" fill="#ddd" text-anchor="middle">아일랜드</text>
  <rect x="450" y="440" width="80" height="80" fill="#8d6e4a" stroke="#5d4a30" stroke-width="2"/> <!-- 테이블 -->
  <text x="490" y="484" font-size="11" fill="#fff" text-anchor="middle">테이블</text>
  <rect x="140" y="420" width="80" height="80" fill="#8d6e4a" stroke="#5d4a30" stroke-width="2"/> <!-- 테이블B(터널 섬) -->
  <rect x="146" y="426" width="68" height="68" fill="url(#tunnel)" opacity="0.7"/>
  <text x="180" y="464" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">테이블 밑 틈</text>

  <!-- 고양이 순찰 루프 -->
  <ellipse cx="340" cy="360" rx="190" ry="150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <text x="340" y="212" font-size="12" fill="#c0392b" text-anchor="middle">🐱 고양이 순찰 동선</text>

  <!-- 치즈존 (등급색: 1~3 노랑 / 4~5 주황 / 6~7 빨강) -->
  <g text-anchor="middle" font-weight="bold">
    <circle cx="400" cy="320" r="26" fill="#f1c40f" opacity="0.9"/><text x="400" y="326" font-size="15">1</text>
    <circle cx="110" cy="570" r="24" fill="#f1c40f" opacity="0.9"/><text x="110" y="576" font-size="15">2</text>
    <circle cx="580" cy="600" r="24" fill="#f1c40f" opacity="0.9"/><text x="580" y="606" font-size="15">3</text>
    <circle cx="120" cy="120" r="24" fill="#e67e22" opacity="0.9"/><text x="120" y="126" font-size="15">4</text>
    <circle cx="580" cy="160" r="24" fill="#e67e22" opacity="0.9"/><text x="580" y="166" font-size="15">5</text>
    <circle cx="260" cy="300" r="26" fill="#c0392b" opacity="0.9"/><text x="260" y="306" font-size="15" fill="#fff">6</text>
    <circle cx="340" cy="480" r="28" fill="#c0392b" opacity="0.95"/><text x="340" y="487" font-size="16" fill="#fff">7</text>
  </g>

  <!-- 쥐구멍 출입구 -->
  <g fill="#2c2c34" stroke="#111" stroke-width="1.5">
    <circle cx="200" cy="72" r="7"/><circle cx="460" cy="72" r="7"/>
    <circle cx="72" cy="200" r="7"/><circle cx="72" cy="440" r="7"/>
    <circle cx="608" cy="300" r="7"/><circle cx="608" cy="520" r="7"/>
    <circle cx="240" cy="608" r="7"/><circle cx="480" cy="608" r="7"/>
    <circle cx="180" cy="500" r="7"/>
  </g>
  <text x="200" y="95" font-size="10" text-anchor="middle">○ 쥐구멍</text>

  <!-- 벽 -->
  <rect x="40" y="40" width="600" height="600" fill="none" stroke="#2c2c34" stroke-width="8"/>

  <!-- 범례 -->
  <g font-size="13">
    <rect x="40" y="668" width="22" height="14" fill="url(#tunnel)"/><text x="70" y="680">쥐 전용 터널 (고양이 진입 불가·수입 0)</text>
    <circle cx="360" cy="675" r="8" fill="#f1c40f"/><text x="374" y="680">1~3 안전존 (터널 인접·저수입)</text>
    <circle cx="51" cy="702" r="8" fill="#e67e22"/><text x="66" y="707">4~5 중간존</text>
    <circle cx="200" cy="702" r="8" fill="#c0392b"/><text x="215" y="707">6~7 개활지 (터널까지 5~8m·고수입)</text>
    <text x="40" y="734" fill="#555">리듬: 터널에서 대기 → 치즈존에서 벌기/먹기(유지비 10초 −10) → 고양이 접근 시 가장 가까운 쥐구멍으로</text>
    <text x="40" y="756" fill="#555">중앙(6·7)은 터널 없음 — 대시 없이는 도박. 테이블 밑 틈이 유일한 중앙 인접 피난처.</text>
  </g>
</svg>
